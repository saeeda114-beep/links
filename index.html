<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الروابط المدرسية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Arabic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-emerald-700 text-white shadow-lg border-b-4 border-emerald-900">
        <div class="max-w-6xl mx-auto px-4 py-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-full mb-3 shadow-inner">
                <i class="fa-solid fa-school text-3xl text-emerald-200"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">بوابة الروابط والخدمات المدرسية</h1>
            <p class="text-emerald-100 text-sm md:text-base mt-2 max-w-xl mx-auto opacity-90">
                جميع الروابط المعتمدة والنماذج التنظيمية للمدرسة في مكان واحد
            </p>
        </div>
    </header>

    <!-- Search & Controls Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200 mb-8">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                
                <!-- Search Bar -->
                <div class="relative w-full md:w-1/2">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterLinks()" 
                        placeholder="ابحث عن رابط أو خدمة..." 
                        class="w-full pr-11 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition text-sm">
                </div>

                <!-- Categories Dropdown -->
                <div class="w-full md:w-auto flex items-center gap-2 overflow-x-auto pb-2 md:pb-0" id="categoryButtons">
                    <button onclick="selectCategory('all')" class="cat-btn active-cat bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition shadow-sm">
                        الكل
                    </button>
                </div>

            </div>
        </div>

        <!-- Links Grid Container -->
        <div id="linksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading Indicator -->
            <div class="col-span-full text-center py-12">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-600"></i>
                <p class="mt-3 text-slate-500 text-sm font-medium">جاري تحميل الروابط...</p>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 my-6">
            <i class="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
            <h3 class="text-lg font-bold text-slate-600">لا توجد نتائج متطابقة</h3>
            <p class="text-slate-400 text-sm mt-1">جرب البحث بكلمات أخرى أو اختر تصنيفاً مختلفاً</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-slate-500 text-xs">
        <div class="max-w-6xl mx-auto px-4">
            <p>© جميع الحقوق محفوظة - الإدارة المدرسية</p>
        </div>
    </footer>

    <!-- Script -->
    <script>
        let allLinks = [];
        let currentCategory = 'all';

        // Fetch Links from JSON
        async function fetchLinks() {
            try {
                const response = await fetch('links.json');
                if (!response.ok) throw new Error('فشل تحميل الملف');
                allLinks = await response.json();
                renderCategories();
                renderLinks(allLinks);
            } catch (error) {
                console.error(error);
                document.getElementById('linksGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 bg-red-50 text-red-600 rounded-xl border border-red-200">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p class="font-bold">حدث خطأ في تحميل الروابط!</p>
                        <p class="text-xs mt-1">تأكد من رفع ملف links.json في نفس مستودع GitHub</p>
                    </div>
                `;
            }
        }

        // Render Categories Dynamically
        function renderCategories() {
            const categories = ['all', ...new Set(allLinks.map(link => link.category))];
            const container = document.getElementById('categoryButtons');
            
            container.innerHTML = categories.map(cat => {
                const isAll = cat === 'all';
                const label = isAll ? 'الكل' : cat;
                return `
                    <button onclick="selectCategory('${cat}')" 
                        class="cat-btn ${isAll ? 'bg-emerald-700 text-white font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'} px-4 py-2.5 rounded-xl text-sm whitespace-nowrap transition shadow-sm">
                        ${label}
                    </button>
                `;
            }).join('');
        }

        // Render Links Cards
        function renderLinks(links) {
            const grid = document.getElementById('linksGrid');
            const emptyState = document.getElementById('emptyState');

            if (links.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = links.map(link => `
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md hover:-translate-y-1 transition duration-200 flex flex-col justify-between group">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-50 text-emerald-700 group-hover:bg-emerald-700 group-hover:text-white transition duration-200 text-xl">
                                <i class="fa-solid ${link.icon || 'fa-link'}"></i>
                            </span>
                            <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-500 rounded-md">
                                ${link.category}
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-2 group-hover:text-emerald-700 transition">
                            ${link.title}
                        </h3>
                        <p class="text-slate-500 text-xs leading-relaxed mb-6">
                            ${link.description || 'اضغط على الزر أدناه للانتقال للخدمة.'}
                        </p>
                    </div>
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
                       class="w-full text-center py-2.5 px-4 bg-slate-900 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                       <span>الانتقال للرابط</span>
                       <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                </div>
            `).join('');
        }

        // Filter Functionality
        function filterLinks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allLinks.filter(link => {
                const matchesSearch = link.title.toLowerCase().includes(searchTerm) || 
                                      (link.description && link.description.toLowerCase().includes(searchTerm));
                const matchesCategory = currentCategory === 'all' || link.category === currentCategory;
                
                return matchesSearch && matchesCategory;
            });

            renderLinks(filtered);
        }

        // Category Switcher
        function selectCategory(category) {
            currentCategory = category;
            
            // Update UI buttons
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                btn.className = 'cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-2.5 rounded-xl text-sm whitespace-nowrap transition shadow-sm';
            });
            event.target.className = 'cat-btn bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm whitespace-nowrap transition shadow-sm';

            filterLinks();
        }

        // Initialize
        fetchLinks();
    </script>
</body>
</html>
